# ------------------------- COMMON RP2040 DEFINITIONS -----------------
[env_common_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
board_build.core = earlephilhower
; LittleFS holds an uploaded firmware image during a WiFi update (arduino-pico Updater), so it must fit one
board_build.filesystem_size = 1m
; arduino-pico USB serial only sends once the host asserts DTR (common.ini turns it off for ESP resets)
monitor_dtr = 1
build_flags =
	-D PLATFORM_RP2040=1
	-Wl,-Map,${BUILD_DIR}/firmware.map
build_src_filter = ${common_env_data.build_src_filter} -<ESP32*.*> -<ESP8266*.*>
extra_scripts =
	${env.extra_scripts}
	pre:python/rp2040_device_tests.py
	pre:python/rp2040_config_fallback.py
	pre:python/copy_html.py
lib_deps =
	esp32async/ESPAsyncWebServer @ 3.8.1
	makuna/NeoPixelBus @ 2.8.4
	bblanchon/ArduinoJson @ 7.4.2
	${common_env_data.mavlink_lib_dep}

[env_common_rp2040rx]
extends = env_common_rp2040
build_flags =
	${env_common_rp2040.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
build_src_filter =
	${env_common_rp2040.build_src_filter} -<tx_*.cpp> -<tx-*/> -<rx-serial/SerialSmartAudio.cpp> -<rx-serial/SerialTramp.cpp>
; on-device tests only, e.g. the hwTimer bench test
test_filter = test_embedded_rp2040*
; bench-only libraries (rp2040_stubs/BENCH_*), never upstreamed
lib_extra_dirs = rp2040_stubs
; libraries not ported yet, added to each env's radio lib_ignore
lib_ignore_rp2040 =
	SerialUpdate
	THERMAL
	SCREEN
	GSENSOR
	BLE

[env:Pico_W_900_RX_via_UART]
extends = env_common_rp2040rx, radio_SX127X
build_flags =
	${env_common_rp2040rx.build_flags}
	${radio_SX127X.build_flags}
; bench pin map compiled in as a fallback when LittleFS has no /hardware.json
custom_hardware_fallback = rp2040_stubs/hardware.json
lib_ignore =
	${radio_SX127X.lib_ignore}
	${env_common_rp2040rx.lib_ignore_rp2040}

[env:Pico_W_2400_RX_via_UART]
extends = env_common_rp2040rx, radio_SX128X
build_flags =
	${env_common_rp2040rx.build_flags}
	${radio_SX128X.build_flags}
; LAMBDA80C-24D bench pin map, same Pico GPIOs as the 900 MHz build (GP20 = DIO1, GP22 = BUSY)
custom_hardware_fallback = rp2040_stubs/hardware_lambda80.json
; the SX127x and power tests are specific to the 900 MHz radio
test_filter =
	test_embedded_rp2040
	test_embedded_rp2040_config
lib_ignore =
	${radio_SX128X.lib_ignore}
	${env_common_rp2040rx.lib_ignore_rp2040}
